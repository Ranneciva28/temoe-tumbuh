name: Deploy to Tencent CyberPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: temoe-tumbuh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.TENCENT_SSH_HOST }}
    steps:
      - name: Deployment not configured yet
        if: env.DEPLOY_HOST == ''
        run: echo "Tencent deployment secrets are not configured yet; skipping deploy."

      - name: Prepare SSH key
        if: env.DEPLOY_HOST != ''
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TENCENT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.TENCENT_SSH_PORT }}" -H "${{ secrets.TENCENT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        if: env.DEPLOY_HOST != ''
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy \
            -p "${{ secrets.TENCENT_SSH_PORT }}" \
            "${{ secrets.TENCENT_SSH_USER }}@${{ secrets.TENCENT_SSH_HOST }}" \
            "sudo -n -u '${{ secrets.TENCENT_SITE_USER }}' -H env \
              APP_DIR='${{ secrets.TENCENT_APP_PATH }}' \
              PHP_BIN='/usr/local/lsws/lsphp83/bin/php' \
              bash '${{ secrets.TENCENT_APP_PATH }}/deploy/cyberpanel-deploy.sh'"
