name: Deploy to Tencent CyberPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: temoe-tumbuh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TENCENT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.TENCENT_SSH_PORT }}" -H "${{ secrets.TENCENT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.TENCENT_SSH_PORT }}" \
            "${{ secrets.TENCENT_SSH_USER }}@${{ secrets.TENCENT_SSH_HOST }}" \
            "cd '${{ secrets.TENCENT_APP_PATH }}' && bash deploy/cyberpanel-deploy.sh"
